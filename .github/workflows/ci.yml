name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests migrations scripts
      - run: python -m ruff format --check app tests migrations scripts
      - run: python -m pytest -q --cov=app --cov-report=term-missing

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: git diff --exit-code -- public/assets/demo.js
      - run: web/node_modules/.bin/playwright install --with-deps chromium
      - run: mkdir -p data
      - run: npm test --prefix web
